name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Regex safety (ReDoS)
        run: npm run check:regex

      - name: Prepare release notes
        id: notes
        shell: pwsh
        run: |
          $raw = ''
          if (Test-Path RELEASE_NOTES.md) { $raw = Get-Content RELEASE_NOTES.md -Raw }
          $clean = ([regex]::Replace($raw, '(?s)<!--.*?-->', '')).Trim()
          if (-not $clean) {
            $clean = "Layer ${{ github.ref_name }} — install or let the app auto-update."
          }
          Set-Content -Path notes.md -Value $clean -Encoding utf8
          "RELEASE_NOTES<<NOTES_EOF" | Add-Content $env:GITHUB_ENV
          $clean                     | Add-Content $env:GITHUB_ENV
          "NOTES_EOF"                | Add-Content $env:GITHUB_ENV

      - name: Build Layer (signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Generate update manifest
        run: node scripts/make-latest-json.mjs ${{ github.ref_name }} "" latest.json ${{ github.repository }}

      - name: Publish release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1
          Copy-Item $exe.FullName "Layer-Setup.exe"
          $assets = @(
            "$($exe.FullName)#Layer installer x64 (versioned)",
            "Layer-Setup.exe#Layer installer",
            "latest.json"
          )
          gh release create ${{ github.ref_name }} @assets `
            --repo ${{ github.repository }} `
            --title "Layer ${{ github.ref_name }}" `
            --notes-file notes.md
